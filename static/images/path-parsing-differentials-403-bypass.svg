<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t d">
  <title id="t">One URL, two parsers</title>
  <desc id="d">The plain path /app/metrics matches the proxy deny rule and gets 403. The path /app;%09/metrics matches no proxy rule, is forwarded, and the backend normalizes it to /app/metrics and returns the metrics.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f87171"/>
    </marker>
  </defs>
  <style>
    .sans{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#1e293b;stroke:#334155;stroke-width:2}
    .lbl{fill:#e2e8f0;font-size:18px}
    .col{fill:#94a3b8;font-size:15px;letter-spacing:.08em}
  </style>
  <rect width="1200" height="630" rx="24" fill="#0f172a"/>
  <text x="48" y="66" class="sans" font-size="30" font-weight="700" fill="#f8fafc">One URL, two parsers</text>

  <text x="185" y="118" class="sans col" text-anchor="middle">REQUEST PATH</text>
  <text x="510" y="118" class="sans col" text-anchor="middle">REVERSE PROXY</text>
  <text x="840" y="118" class="sans col" text-anchor="middle">APP SERVER</text>
  <text x="1090" y="118" class="sans col" text-anchor="middle">RESULT</text>

  <!-- row 1 -->
  <rect x="60" y="140" width="250" height="72" rx="10" class="box"/>
  <text x="185" y="183" class="mono" font-size="19" fill="#f8fafc" text-anchor="middle">/app/metrics</text>
  <path d="M310 176 H378" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="380" y="140" width="260" height="72" rx="10" fill="#1e293b" stroke="#4ade80" stroke-width="2"/>
  <text x="510" y="171" class="sans lbl" text-anchor="middle">deny /app/metrics</text>
  <text x="510" y="196" class="sans" font-size="15" fill="#4ade80" text-anchor="middle">✓ rule matches</text>
  <path d="M640 176 H1018" stroke="#4ade80" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#a)"/>
  <text x="840" y="166" class="sans" font-size="14" fill="#94a3b8" text-anchor="middle">never forwarded</text>
  <rect x="1020" y="140" width="140" height="72" rx="10" fill="#14532d" stroke="#4ade80" stroke-width="2"/>
  <text x="1090" y="183" class="sans" font-size="20" font-weight="700" fill="#dcfce7" text-anchor="middle">403</text>

  <!-- row 2 -->
  <rect x="60" y="270" width="250" height="72" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="2"/>
  <text x="185" y="313" class="mono" font-size="19" fill="#fca5a5" text-anchor="middle">/app;%09/metrics</text>
  <path d="M310 306 H378" stroke="#f87171" stroke-width="2.5" marker-end="url(#ar)"/>
  <rect x="380" y="270" width="260" height="72" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="2"/>
  <text x="510" y="301" class="sans lbl" text-anchor="middle">deny /app/metrics</text>
  <text x="510" y="326" class="sans" font-size="15" fill="#f87171" text-anchor="middle">✗ no match → forward</text>
  <path d="M640 306 H708" stroke="#f87171" stroke-width="2.5" marker-end="url(#ar)"/>
  <rect x="710" y="270" width="260" height="72" rx="10" class="box"/>
  <text x="840" y="301" class="sans lbl" text-anchor="middle">normalizes path</text>
  <text x="840" y="326" class="mono" font-size="15" fill="#fbbf24" text-anchor="middle">→ /app/metrics</text>
  <path d="M970 306 H1018" stroke="#f87171" stroke-width="2.5" marker-end="url(#ar)"/>
  <rect x="1020" y="270" width="140" height="72" rx="10" fill="#450a0a" stroke="#f87171" stroke-width="2"/>
  <text x="1090" y="301" class="sans" font-size="20" font-weight="700" fill="#fecaca" text-anchor="middle">200</text>
  <text x="1090" y="326" class="sans" font-size="14" fill="#fca5a5" text-anchor="middle">metrics leak</text>

  <!-- normalization strip -->
  <rect x="60" y="400" width="1100" height="180" rx="14" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="84" y="436" class="sans" font-size="19" font-weight="700" fill="#f8fafc">What the app server does with the segment</text>
  <rect x="84" y="466" width="270" height="64" rx="10" class="box"/>
  <text x="219" y="505" class="mono" font-size="18" fill="#fca5a5" text-anchor="middle">app;%09</text>
  <path d="M354 498 H412" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="383" y="556" class="sans" font-size="14" fill="#94a3b8" text-anchor="middle">decode</text>
  <rect x="414" y="466" width="270" height="64" rx="10" class="box"/>
  <text x="549" y="505" class="mono" font-size="18" fill="#e2e8f0" text-anchor="middle">app;⇥</text>
  <path d="M684 498 H742" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="713" y="556" class="sans" font-size="14" fill="#94a3b8" text-anchor="middle">drop ;params, trim</text>
  <rect x="744" y="466" width="270" height="64" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text x="879" y="505" class="mono" font-size="18" fill="#fbbf24" text-anchor="middle">app</text>
  <text x="1086" y="505" class="sans" font-size="15" fill="#94a3b8" text-anchor="middle">same route</text>
</svg>
